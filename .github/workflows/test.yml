name: Test

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - feature/auto-diagnostics
      - feature/auto-diagnostics-tests
      - feature/auto-diagnostics-polish

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
